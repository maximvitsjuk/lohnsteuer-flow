*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:24px;font-weight:500;margin:0}h2{font-size:17px;font-weight:500;margin:24px 0 10px}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
a{color:var(--accent)}
.back{display:inline-block;margin-bottom:12px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{padding:7px 14px;border:0;background:var(--bg);color:var(--text);font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-draft{background:var(--draftbg);color:var(--draft)}.b-plan{background:var(--planbg);color:var(--plan)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filters button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.filters button.on{border-color:var(--accent);color:var(--accent)}
.item{display:grid;grid-template-columns:110px 1fr;gap:12px}
.item .when{font-size:13px;color:var(--muted)}
.item h3{font-size:15px;font-weight:500;margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chg{font-variant-numeric:tabular-nums;font-size:15px;margin:2px 0 6px}
.chg b{font-weight:500}
.item p{margin:0 0 6px;font-size:14px}
.impact{font-size:13px;background:var(--bg);border-left:3px solid var(--accent);padding:6px 10px;margin:6px 0}
.src{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:24px;line-height:1.7}footer a{color:inherit}
@media (max-width:640px){.item{grid-template-columns:1fr}}
.topnav{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--border)}
.topnav a{padding:8px 14px;color:var(--muted);text-decoration:none;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.topnav a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.sal{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center}
.sal input[type=number]{width:100%;padding:8px 10px;font-size:18px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.sal input[type=range]{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:12px}
.chips span{border:1px solid var(--border);border-radius:999px;padding:2px 10px;color:var(--muted)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.tot>div{border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.tot .l{font-size:12px;color:var(--muted)}.tot .v{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}.tot .d{font-size:13px;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.down{color:#A32D2D}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .down{color:#F09595}}:root[data-theme=dark] .down{color:#F09595}
.mine{font-size:14px;font-weight:500;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.mine.none{font-weight:400;color:var(--muted)}
@media (max-width:640px){.sal{grid-template-columns:1fr}}
</style>

 const mini=o.adv.sj&&o.adv.sjg>0&&o.adv.sjg<=P26.mini;
 one.miniRv=(mini&&o.adv.sjrv&&o.rv)?E.r2(-o.adv.sjg*P26.miniRvAN):0;
 const dec=['miniLimit','kvBBG'],dr=dec.concat(['rvBBG','taxReform','pvDraft','flat5']),pl=dr.concat(['rv20']);
 return {base,one,dec:E.r2(base+d(dec)),draft:E.r2(base+d(dr)),plan:E.r2(base+d(pl))};}
let lang=window.FORCE_LANG||(()=>{try{const s=sessionStorage.getItem('lang');if(s)return s;}catch(e){}return (navigator.language||'en').toLowerCase().startsWith('de')?'de':'en';})();
let cat='all';
const $=id=>document.getElementById(id);
function render(){
 const t=L[lang];document.documentElement.lang=lang;document.title=window.PAGE_TITLE||t.title+(lang==='de'?' · Wohin geht mein Gehalt?':' · Where does my salary go?');
 $('title').textContent=t.title;$('sub').textContent=t.sub;$('asof').textContent=t.asof;$('howUpd').innerHTML=t.howUpd;$('foot').innerHTML=t.foot+'<br>'+DATA_LINE[lang];
 $('legend').innerHTML=Object.keys(STATUS).map(k=>`<span><span class="badge ${STATUS[k]}">${t.st[k]}</span> ${t.stLong[k].split('–')[1]||''}</span>`).join('');
 const cats=['all','tax','sv','mini','future'];
 $('filters').innerHTML=cats.map(c=>`<button data-c="${c}" class="${c===cat?'on':''}">${c==='all'?t.all:t.cat[c]}</button>`).join('');
 $('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;render();});
 const st=loadSt(),o=inputsFrom(st),R=personal(o);
 const loc=lang==='de'?'de-DE':'en-IE',fm=v=>new Intl.NumberFormat(loc,{style:'currency',currency:'EUR'}).format(v);
 const sg=v=>(v>0?'+':'')+fm(v);
 document.querySelectorAll('[data-nav]').forEach(a=>a.textContent={overview:t.navOverview,past:t.navPast,now:t.navNow,future:t.navFuture}[a.dataset.nav]);
 $('salL').textContent=t.salL;if(document.activeElement!==$('gross'))$('gross').value=o.g;$('grossR').value=o.g;
 const ch=t.chip;$('chips').innerHTML=[`${ch.cls} ${['I','II','III','IV','V','VI'][o.cls-1]}`,`${o.kids} ${ch.kids}`,o.state,o.status==='stud'?ch.stud:(o.status==='beamt'?ch.beamt:(o.priv?ch.priv:ch.pub)),o.ki?ch.church:'',o.adv.sj&&o.adv.sjg>0?ch.second+' '+fm(o.adv.sjg):''].filter(Boolean).map(x=>`<span>${x}</span>`).join('')+`<a href="index.html" style="font-size:12px;margin-left:4px">${t.settings}</a>`;
 const cell=(l,v,dv)=>`<div><div class="l">${l}</div><div class="v">${fm(v)}</div><div class="d ${dv>0.004?'up':(dv<-0.004?'down':'')}">${dv==null?t.perMonth:sg(dv)+' / '+(lang==='de'?'Monat':'month')}</div></div>`;
 $('tot').innerHTML=cell(t.totNow,R.base,null)+cell(t.totDec,R.dec,E.r2(R.dec-R.base))+cell(t.totDraft,R.draft,E.r2(R.draft-R.base))+cell(t.totPlan,R.plan,E.r2(R.plan-R.base));
 $('totNote').textContent=t.totNote;
 const mine=x=>{if(x.k==='info')return `<div class="mine none">${t.mineInfo}</div>`;const v=R.one[x.k]||0;
  if(Math.abs(v)<0.005)return `<div class="mine none">${t.mineNone}</div>`;
  return `<div class="mine ${v>0?'up':'down'}">${t.mineFor.replace('{g}',fm(o.g))} ${sg(v)} / ${lang==='de'?'Monat':'month'}</div>`;};
 const order=['tax','sv','mini','future'];
 let h='';
 for(const c of order){if(cat!=='all'&&cat!==c)continue;const its=ITEMS.filter(x=>x.cat===c);if(!its.length)continue;
  h+=`<h2>${t.cat[c]}</h2>`;
  for(const x of its){h+=`<div class="card item"><div class="when">${x.when[lang]}<br><span class="badge ${STATUS[x.st]}" style="margin-top:6px">${t.st[x.st]}</span></div><div>
   <h3>${x.t[lang]}</h3><div class="chg">${x.chg[lang]}</div>${mine(x)}
   <p>${x.d[lang]}</p><div class="impact"><b style="font-weight:500">${t.impactL}</b> ${x.i[lang]}</div>
   <div class="src">${t.srcL}: ${x.s.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join(' · ')}</div></div></div>`;}
 }
 $('list').innerHTML=h;
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{if(window.switchLang&&switchLang(b.dataset.lang))return;lang=b.dataset.lang;try{sessionStorage.setItem('lang',lang);}catch(e){}render();});
$('gross').addEventListener('input',()=>{saveGross(Math.max(0,+$('gross').value||0));render();});
$('grossR').addEventListener('input',()=>{$('gross').value=$('grossR').value;saveGross(+$('grossR').value);render();});
render();
</script>
